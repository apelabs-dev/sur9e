name: User data boundary

on:
  pull_request:
    branches: [main]
  push:
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: No private user data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Check user-data boundary
        if: ${{ github.event_name == 'pull_request' }}
        run: node src/lib/check-user-data-boundary.mjs

      # ci/** pushes and manual runs have no PR base/head, so scan every tracked file.
      - name: Check user-data boundary (all tracked files)
        if: ${{ github.event_name != 'pull_request' }}
        run: node src/lib/check-user-data-boundary.mjs --tracked
